<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAMMA — BIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #C24D2C;
      --card-bg: rgba(22, 24, 29, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(200, 122, 84, 0.5);
      --accent-copper: #C87A54;
      --accent-copper-glow: rgba(200, 122, 84, 0.25);
      --text-main: #F4F4F6;
      --text-muted: #9CA3AF;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo com gradiente sutil */
    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-copper-glow) 0%, rgba(11, 12, 14, 0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Perfil / Header */
    .profile-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(145deg, #1C1E24, #121316);
      border: 1px solid rgba(200, 122, 84, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-copper-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--accent-copper);
      letter-spacing: -1px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
      font-weight: 400;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Links / Botões */
    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .link-item:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
      background: rgba(28, 30, 36, 0.85);
      box-shadow: 0 8px 24px rgba(200, 122, 84, 0.15);
    }

    /* Destaque Principal (ex: Landing Page ou WhatsApp) */
    .link-item.featured {
      background: linear-gradient(135deg, rgba(200, 122, 84, 0.15) 0%, rgba(22, 24, 29, 0.9) 100%);
      border: 1px solid rgba(200, 122, 84, 0.45);
    }

    .link-item.featured:hover {
      border-color: var(--accent-copper);
      box-shadow: 0 8px 28px rgba(200, 122, 84, 0.25);
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--accent-copper);
    }

    .link-item svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-icon {
      color: var(--text-muted);
      transition: var(--transition);
      opacity: 0.6;
    }

    .link-item:hover .arrow-icon {
      color: var(--accent-copper);
      transform: translateX(3px);
      opacity: 1;
    }

    /* Rodapé */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
    }

    .footer span {
      color: var(--accent-copper);
      font-weight: 600;
    }
  </style>
</head>
<body>

        <div class="link-content">

      </a>
      
    </section>

    <footer class="footer">
      <p>&copy; 2026 <span>TRAMMA</span>. Conectando marcas à relevância.</p>
    </footer>

  </main>

</body>
</html>
